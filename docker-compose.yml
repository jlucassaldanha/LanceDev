services:
  db:
    image: postgres:15
    container_name: lancedev_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: leiloes_db
    ports:
      - "5432:5432"
    volumes:
      - lancedev_pgdata:/var/lib/postgresql/data

volumes:
  lancedev_pgdata: